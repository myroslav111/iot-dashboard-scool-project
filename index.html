<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 Plant Control</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🌱 Smart Plant Dashboard</h1>

<div class="container">

  <div class="card">
    <h3>🌡 Temperatur</h3>
    <div id="temp" class="value">--</div>
  </div>

  <div class="card">
    <h3>💧 Feuchtigkeit</h3>
    <div id="hum" class="value">--</div>
  </div>

  <div class="card">
    <h3>☀️ Licht</h3>
    <div id="lux" class="value">--</div>
  </div>

  <div class="card">
    <h3>🫁 CO₂</h3>
    <div id="co2" class="value">--</div>
  </div>

</div>

<button id="waterBtn">💦 Gießen</button>

<div id="status" class="status"></div>

<div class="plant-wrapper">
  <svg id="chamomile" viewBox="0 0 200 200" class="plant happy">

    <!-- Topf -->
    <rect x="70" y="120" width="60" height="50" rx="10" class="pot"/>

    <!-- Stiel -->
    <rect x="95" y="60" width="10" height="70" class="stem"/>

    <!-- Blume -->
    <circle cx="100" cy="50" r="20" class="flower"/>

    <!-- Gesicht -->
    <circle cx="92" cy="48" r="3" class="eye"/>
    <circle cx="108" cy="48" r="3" class="eye"/>
    <path id="mouth" d="M90 58 Q100 65 110 58" class="mouth"/>

  </svg>
</div>
<script src="app.js">
  
</script>

</body>
</html>
